name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: college-gaming-club/client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: college-gaming-club/client
        run: npm ci

      - name: Build Client (Validation)
        working-directory: college-gaming-club/client
        run: npm run build

      - name: Check Vercel Secrets
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "::notice ::VERCEL_TOKEN secret is not set in GitHub repository secrets. If you deploy directly via Vercel GitHub integration, Vercel builds automatically from git commits. To enable GitHub Actions Vercel CLI deployment, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in GitHub Settings -> Secrets and variables -> Actions."

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
